name: Reporte diario

on:
  # Hora de Ciudad de México = UTC-6 todo el año (sin horario de verano).
  #
  # DISPARO PRINCIPAL: una automatización de Atajos en el iPhone llama a las 06:00 a la API de
  # GitHub (evento workflow_dispatch, el mismo del botón "Run workflow"). Ese tipo de corrida
  # arranca en segundos.
  #
  # RESPALDO: las tareas programadas de GitHub NO son puntuales. En este repositorio llegaron
  # unas 6 horas tarde (programadas 06:07 y 06:47, ejecutadas 11:55, 12:18 y 12:30). Se dejan
  # solo por si el iPhone no disparó: cualquier corrida programada se salta si ya hay página
  # de hoy (paso "Decidir si hace falta correr"), así una tardía no reemplaza la de la mañana
  # por una de mediodía.
  schedule:
    - cron: "7 12 * * 1-5"    # 12:07 UTC = 06:07 en CDMX (si GitHub cumpliera)
    - cron: "47 12 * * 1-5"   # 12:47 UTC = 06:47 en CDMX
  # El disparo del iPhone y el botón "Run workflow" de la pestaña Actions.
  workflow_dispatch:
  # Al subir cambios al código o a tu lista de EE. UU. se regenera la página (el commit del
  # propio robot solo toca docs/, que no está en esta lista, así que no se dispara en bucle).
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "tools/**"
      - ".github/workflows/reporte-diario.yml"

permissions:
  contents: write   # necesario para que el robot guarde docs/index.html en el repositorio

# Si el respaldo arranca mientras la principal sigue trabajando, espera su turno; para cuando
# le toque, la página ya estará publicada y el respaldo se salta solo.
concurrency:
  group: reporte-diario
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decidir si hace falta correr
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # Solo las corridas programadas (respaldo) pueden saltarse. El disparo del iPhone, el
          # botón manual y los cambios de código siempre corren.
          omitir=false
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$(python tools/ya_publicado.py docs/index.html)" = "si" ]; then
              omitir=true
              echo "Respaldo ($CRON): la página de hoy ya está publicada, no hay nada que hacer."
            else
              echo "Respaldo ($CRON): todavía no hay página de hoy, la genero."
            fi
          fi
          echo "omitir=$omitir" >> "$GITHUB_OUTPUT"

      - name: Generar reporte y página
        if: steps.decidir.outputs.omitir != 'true'
        env:
          # Opcional: si guardas tu token de Banxico como secreto del repositorio, aparece la
          # sección macro. Sin él, simplemente se omite.
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python scripts/research.py --ttl 0 --web docs/index.html --salida "$RUNNER_TEMP/reporte.md"

      - name: Publicar en el repositorio
        if: steps.decidir.outputs.omitir != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Reporte $(TZ=America/Mexico_City date +%F)"
            git pull --rebase origin main
            git push
          fi
